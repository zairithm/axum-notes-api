[package]
name = "axum-notes-api"
version = "0.1.0"
edition = "2021"
description = "REST API for notes, built with Axum"
license = "MIT"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
